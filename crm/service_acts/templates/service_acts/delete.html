{% extends 'base.html' %}
{% block title %}Удаление акта{% endblock %}
{% block content %}
<h4>Удалить акт выполненных работ № {{ object.number }}?</h4>
<form method="post">
  {% csrf_token %}
  <p>Вы уверены, что хотите удалить этот акт?</p>
  <button class="btn red">Удалить</button>
  <a href="{% url 'service_acts:list' %}" class="btn grey">Отмена</a>
</form>
{% endblock %}
