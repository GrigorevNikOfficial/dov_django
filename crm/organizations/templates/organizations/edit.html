{% extends 'base.html' %} {% block title %}Редактировать организацию{% endblock %} {% block content %}
<h4>Редактировать организацию</h4>
<form method="post">
  {% csrf_token %}
  <div class="input-field">
    {{ form.name }}<label class="active" for="{{ form.name.id_for_label }}"
      >Название</label
    >
  </div>
  <div class="input-field">
    {{ form.address }}<label
      class="active"
      for="{{ form.address.id_for_label }}"
      >Адрес</label
    >
  </div>
  <div class="input-field">
    {{ form.inn }}<label class="active" for="{{ form.inn.id_for_label }}"
      >ИНН</label
    >
  </div>
  <div class="input-field">
    {{ form.kpp }}<label class="active" for="{{ form.kpp.id_for_label }}"
      >КПП</label
    >
  </div>
  <div class="input-field select-field">
    {{ form.account }}<label
      class="active"
      for="{{ form.account.id_for_label }}"
      >Счёт</label
    >
  </div>
  <div class="input-field">
    {{ form.chief }}<label class="active" for="{{ form.chief.id_for_label }}"
      >Руководитель</label
    >
  </div>
  <div class="input-field">
    {{ form.financial_chief }}<label
      class="active"
      for="{{ form.financial_chief.id_for_label }}"
      >Главный бухгалтер</label
    >
  </div>
  <button class="btn">Сохранить</button>
</form>
{% endblock %}
